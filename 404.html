<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>document.documentElement.classList.add('js')</script>
<!-- ENTFERNEN sobald Impressum+Datenschutz live & freigegeben -->
<meta name="robots" content="noindex, nofollow">
<title>Seite nicht gefunden | Executive Reset · A. Faubel</title>
<meta name="description" content="Diese Seite gibt es nicht. Der Weg zurück zur Startseite ist kurz.">
<meta property="og:title" content="Diese Seite gibt es nicht.">
<meta property="og:description" content="Der Weg zurück ist kurz.">
<meta property="og:type" content="website">
<meta property="og:locale" content="de_DE">
<!-- og:image relativ, bis die Domain feststeht — ein absoluter Verweis auf
     eine noch nicht existierende Adresse bricht die WhatsApp-Vorschau.
     Bei Go-Live: absolute URL + og:url wieder eintragen. -->
<meta property="og:image" content="assets/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="theme-color" content="#F0EEE9">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2315161A'/%3E%3Cpath d='M6 24h20' stroke='%23F0EEE9' stroke-width='1.5'/%3E%3Cpath d='M16 7v13' stroke='%238C8C88' stroke-width='1.5'/%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/fonts.css">
<style>
/* ⚠ SYNC-PFLICHT — vierter von vier Token-Blöcken (index.html ·
   bewerbung.html · assets/legal.css · 404.html). Wer einen ändert,
   ändert alle vier: Typo UND Raster (--spalte / --text). */
:root{
  --papier:#F0EEE9; --tinte:#15161A; --zinn:#8C8C88; --signatur:#2E3A45;
  --serif:'Libre Caslon Display','Caslon Fallback',Georgia,serif;
  --sans:'Archivo','Archivo Fallback','Helvetica Neue',Arial,sans-serif;
  --s1:clamp(2.9375rem, 1.05rem + 5.9vw, 5.75rem);   /* 47 → 92, synchron zu index.html/legal.css */
  --s3:1.25rem;
  --s4:clamp(0.75rem, 0.72rem + 0.14vw, 0.8125rem);
  --dicht:88px; --rand:24px;
  --spalte:1180px; --text:600px;   /* Bühne / Textmaß — synchron zu index.html */
  --ease:cubic-bezier(.22,.61,.36,1);
}
@media (min-width:900px){ :root{ --dicht:120px; --rand:80px } }
*,*::before,*::after{box-sizing:border-box}
html{ -webkit-text-size-adjust:100% }
body{ margin:0; min-height:100svh; display:flex; flex-direction:column;
  background:var(--papier); color:var(--tinte);
  font-family:var(--sans); font-weight:400; font-size:var(--s3); line-height:1.65;
  -webkit-font-smoothing:antialiased; overflow-x:clip }
h1,p{margin:0}
a{color:inherit}
.buehne{ max-width:var(--spalte); margin:0 auto; padding-inline:var(--rand); width:100% }
.t-h1{ font-family:var(--serif); font-weight:400; font-size:var(--s1);
  line-height:1.03; letter-spacing:-0.02em; max-width:14ch }
.t-label{ font-family:var(--sans); font-weight:500; font-size:var(--s4);
  letter-spacing:.16em; text-transform:uppercase; line-height:1.4 }
.linie{ height:1px; width:104px; background:var(--zinn); margin:22px 0 0 }
.lead{ margin-top:36px; max-width:38ch }
.cta{ display:inline-flex; align-items:center; justify-content:center;
  min-height:52px; padding:14px 30px; margin-top:44px;
  background:var(--signatur); color:var(--papier); text-decoration:none;
  font-family:var(--sans); font-weight:500; font-size:var(--s4);
  letter-spacing:.1em; line-height:1.2; transition:background .35s var(--ease) }
.cta:hover{ background:var(--tinte) }
:where(a):focus-visible{ outline:2px solid var(--signatur); outline-offset:3px }

.skip{ position:absolute; left:-9999px; top:0; z-index:100;
  background:var(--signatur); color:var(--papier); padding:16px 20px;
  min-height:48px; display:flex; align-items:center;
  font-size:var(--s4); letter-spacing:.08em; text-transform:uppercase; text-decoration:none }
.skip:focus{ left:0 }

/* Absender und Pflichtlinks — bis Runde 3 hatte ausgerechnet die Seite,
   auf der ein Vertipper landet, weder Wortmarke noch Impressum. § 5 DDG
   verlangt „ständig verfügbar“; „auf allen Seiten außer dieser“ ist das
   nicht. Aufbau wie bewerbung.html / die Rechtsseiten. */
.nav{ position:fixed; inset:0 0 auto 0; z-index:60 }
.nav::before{ content:''; position:absolute; inset:0; z-index:-1;
  background:var(--papier); opacity:.94;
  backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px) }
.nav-innen{ display:flex; align-items:center; gap:16px;
  max-width:var(--spalte); margin:0 auto; padding:20px var(--rand) }
.wortmarke{ display:inline-flex; align-items:center; min-height:48px;
  font-family:var(--sans); font-weight:500; font-size:var(--s4);
  letter-spacing:.18em; text-transform:uppercase; text-decoration:none; line-height:1 }
/* Kein „Zurück“ in der Nav: der CTA IST der Weg zurück. Zwei Wege zum
   selben Ziel wären genau das, was G7 „ein Weg“ ausschließt. */

main{ flex:1 0 auto; display:flex; align-items:center;
  padding-block:130px var(--dicht) }
@media (min-width:900px){ main{ padding-block:190px var(--dicht) } }
@media (min-width:900px){ .t-h1{margin-top:56px} }

.site-footer{ flex:0 0 auto; padding-block:56px 40px;
  border-top:1px solid var(--zinn) }
.site-footer nav{ display:flex; flex-wrap:wrap; gap:8px 28px }
.site-footer a{ display:inline-flex; align-items:center; min-height:48px; text-decoration:none }
.site-footer .entwurf{ margin-top:32px; color:var(--signatur) }

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{ transition-duration:.01ms !important; animation:none !important }
}
@media print{ .nav{display:none} body{background:#fff;color:#000;font-size:11pt} }
</style>
</head>
<body>
<a class="skip" href="#inhalt">Zum Inhalt springen</a>
<header class="nav">
  <div class="nav-innen">
    <a class="wortmarke" href="index.html">Alexander&nbsp;Faubel</a>
  </div>
</header>

<main id="inhalt">
  <div class="buehne">
    <p class="t-label">Executive Reset</p>
    <div class="linie" aria-hidden="true"></div>
    <h1 class="t-h1" style="margin-top:40px">Diese Seite gibt es nicht.</h1>
    <p class="lead">Der Weg zurück ist kurz.</p>
    <p><a class="cta" href="index.html">Zur Startseite</a></p>
  </div>
</main>

<footer class="site-footer">
  <div class="buehne">
    <nav aria-label="Rechtliches">
      <a href="impressum.html">Impressum</a>
      <a href="datenschutz.html">Datenschutz</a>
    </nav>
    <p class="t-label entwurf">Entwurf 31.07.2026 · nicht veröffentlichen</p>
  </div>
</footer>
</body>
</html>
